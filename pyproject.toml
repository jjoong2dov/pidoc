[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pidoc"
version = "0.4.0"
description = "실행 증거 없이는 명령·출력·버전·수치가 문서에 들어가지 않게 하는 작은 도구"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
html = ["markdown-it-py"]
pdf = ["markdown-it-py", "weasyprint"]

[project.scripts]
pidoc = "pidoc.cli:main"

[tool.setuptools]
packages = ["pidoc", "pidoc.checks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
